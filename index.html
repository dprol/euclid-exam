<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>What Schools Forget - the final exam</title>
  <meta name="description" content="An examination in classical education: twenty lessons, thirteen questions, and Euclid I.47 drawn one step at a time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23f6efdc'/%3E%3Crect x='4' y='14' width='9' height='14' fill='%232f65a7'/%3E%3Crect x='13' y='14' width='15' height='14' fill='%23f2bc20'/%3E%3Cpath d='M4 14 L10 4 L28 14 Z' fill='%23d9531e'/%3E%3C/svg%3E">

<body class="view-overture">

  <!-- Euclid I.47, drawn one step per question -->
  <div id="stage" aria-hidden="true">
    <svg id="figure" viewBox="20 40 560 650">
      <defs>
        <pattern id="pencil" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="9" stroke="#9b958a" stroke-width="1.4"/>
        </pattern>
      </defs>
      <!-- fills first, so the lines sit on top -->
      <g class="step fill" data-s="4"><polygon points="170,380 235,267.4 122.4,202.4 57.4,315" style="--c:#1b1b1b"/></g>
      <g class="step fill" data-s="5"><polygon points="235,267.4 430,380 542.6,185 347.6,72.4" style="--c:#d9531e"/></g>
      <g class="step fill" data-s="8"><polygon points="170,380 235,380 235,640 170,640" style="--c:#2f65a7"/></g>
      <g class="step fill" data-s="9"><polygon points="235,380 430,380 430,640 235,640" style="--c:#f2bc20"/></g>

      <g class="step line" data-s="0"><line x1="170" y1="380" x2="430" y2="380" style="--c:#d9531e"/></g>
      <g class="step line" data-s="1"><line x1="170" y1="380" x2="235" y2="267.4" style="--c:#2f65a7"/></g>
      <g class="step line" data-s="2"><line x1="235" y1="267.4" x2="430" y2="380" style="--c:#f2bc20"/></g>
      <g class="step line" data-s="3"><polyline points="227,281.3 240.9,289.3 248.9,275.4" style="--c:#1b1b1b"/></g>
      <g class="step line" data-s="4"><polyline points="235,267.4 122.4,202.4 57.4,315 170,380" style="--c:#1b1b1b"/></g>
      <g class="step line" data-s="5"><polyline points="430,380 542.6,185 347.6,72.4 235,267.4" style="--c:#1b1b1b"/></g>
      <g class="step line" data-s="6"><polyline points="170,380 170,640 430,640 430,380" style="--c:#1b1b1b"/></g>
      <g class="step line dotted" data-s="7"><line x1="235" y1="267.4" x2="235" y2="640" style="--c:#1b1b1b"/></g>
      <g class="step line thin" data-s="10"><line x1="235" y1="267.4" x2="170" y2="640" style="--c:#d9531e"/><line x1="57.4" y1="315" x2="430" y2="380" style="--c:#d9531e"/></g>
      <g class="step line thin" data-s="11"><line x1="235" y1="267.4" x2="430" y2="640" style="--c:#2f65a7"/><line x1="170" y1="380" x2="542.6" y2="185" style="--c:#2f65a7"/></g>

      <g class="step letters" data-s="12">
        <text x="226" y="252">A</text><text x="146" y="402">B</text><text x="438" y="402">C</text>
        <text x="150" y="664">D</text><text x="436" y="664">E</text><text x="228" y="664">L</text>
        <text x="34" y="324">F</text><text x="106" y="194">G</text><text x="340" y="62">H</text><text x="550" y="182">K</text>
      </g>
    </svg>
    <p id="caption"></p>
  </div>

  <div id="rail"></div>

  <div id="syllabus" class="sheet" hidden></div>
  <div id="overture" class="sheet"></div>
  <div id="finale" class="sheet" hidden></div>

  <noscript><p class="noscript">This exam needs JavaScript.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
